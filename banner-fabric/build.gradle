import com.mohistmc.banner.gradle.BannerGradlePluginFabric

plugins {
    id 'com.github.johnrengelman.shadow'
}

apply plugin: BannerGradlePluginFabric

architectury {
    platformSetupLoomIde()
    fabric()
}

banner {
    mcVersion = minecraft_version
    bukkitVersion = 'v1_21_R4'
    accessTransformer = project(':banner-common').file('bukkit.at')
    extraMapping = project(':banner-common').file('extra_mapping.tsrg')
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':banner-common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':banner-common', configuration: 'transformProductionFabric')
    common(project(':bootstrap')) { transitive = false }
    shadowBundle (project(':bootstrap')) { transitive = false }

    implementation "org.spigotmc:spigot-api:$minecraft_version-R0.1-SNAPSHOT@jar"
    compileOnly "com.mohistmc.banner.generated:spigot:${minecraft_version}:deobf"

    include "org.spigotmc:spigot-api:$minecraft_version-R0.1-SNAPSHOT@jar"
    include "com.mohistmc.banner.generated:spigot:${minecraft_version}:deobf"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    manifest.attributes 'MixinConnector': 'com.mohistmc.banner.BannerConnector'
    manifest.attributes 'Implementation-Title': 'Banner'
    manifest.attributes 'Implementation-Version': "banner-$minecraft_version-${project.version}"
    manifest.attributes 'Implementation-Vendor': 'Mohist Dev Team'
    manifest.attributes 'Implementation-Timestamp': new Date().format("yyyy-MM-dd HH:mm:ss")
}

tasks.register('fabricMappings', Copy) {
    destinationDir = file('build/fabric_mappings')
    from(banner.mappingsConfiguration.bukkitToFabric) {
        rename { name -> 'bukkit_srg.srg' }
    }
    from(banner.mappingsConfiguration.bukkitToFabricInheritance) {
        rename { name -> 'inheritanceMap.txt' }
    }
}

project.sourceSets.main.output.dir file('build/fabric_mappings'), builtBy: tasks.fabricMappings

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

tasks.register('srgJar', Jar) {
    from(tasks.remapJar.outputs.files.collect { it.isDirectory() ? it : zipTree(it) }) {
        include 'com/mohistmc/**'
        exclude 'com/mohistmc/banner/common/mixin/**'
    }
    archiveClassifier.set('srg')
    dependsOn remapJar
}

